name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Installed CLI smoke
        run: |
          chatclash --version
          chatclash --tree
          chatclash --tree-brief
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Built wheel and ChatEnv provider smoke
        run: |
          python - <<'PY'
          import glob, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "chatclash-wheel"
          subprocess.check_call([sys.executable, "-m", "venv", str(root)])
          python = root / "bin/python"
          subprocess.check_call([str(python), "-m", "pip", "install", *glob.glob("dist/*.whl")])
          subprocess.check_call([str(python), "-m", "pip", "check"])
          env = os.environ.copy()
          env["CHATARCH_HOME"] = str(root / "test-home")
          for cli, args in [("chatclash", ["--version"]), ("chatclash", ["--tree"]), ("chatclash", ["--tree-brief"]), ("chatenv", ["list", "-t", "chatclash"])]:
              subprocess.check_call([str(root / "bin" / cli), *args], cwd=root, env=env)
          PY
      - run: mkdocs build --strict
