name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          tag_name="${GITHUB_REF_NAME#v}"
          package_version="$(python3 - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("src/chatclash/__init__.py").read_text(encoding="utf-8"))
          for stmt in module.body:
              if not isinstance(stmt, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "__version__" for target in stmt.targets):
                  print(ast.literal_eval(stmt.value))
                  break
          else:
              raise SystemExit("__version__ not found in src/chatclash/__init__.py")
          PY
          )"

          if [[ "$tag_name" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Fail if version already exists on PyPI
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          package = "chatclash"
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package}/{version}/json"

          try:
              urllib.request.urlopen(url)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{package} {version} is not yet on PyPI; continuing.")
                  sys.exit(0)
              raise
          else:
              print(
                  f"{package} {version} is already on PyPI. "
                  "Bump src/chatclash/__init__.py and merge that change before pushing a release tag."
              )
              sys.exit(1)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
