name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve package version
        run: |
          package_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("src/chatclash/__init__.py").read_text(encoding="utf-8"))
          for stmt in module.body:
              if not isinstance(stmt, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "__version__" for target in stmt.targets):
                  print(ast.literal_eval(stmt.value))
                  break
          else:
              raise SystemExit("__version__ not found in src/chatclash/__init__.py")
          PY
          )"
          echo "PACKAGE_VERSION=${package_version}" >> "$GITHUB_ENV"

      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Check release commit is on default branch
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"

      - name: Check PyPI version
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          package = "chatclash"
          version = os.environ["PACKAGE_VERSION"]
          base_url = "https://pypi.org/pypi/chatclash/"
          url = f"{base_url}{version}/json"
          try:
              urllib.request.urlopen(url, timeout=20)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{package} {version} is not yet on PyPI; continuing.")
                  sys.exit(0)
              raise
          else:
              print(f"{package} {version} is already on PyPI; refusing to overwrite.")
              sys.exit(1)
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
