[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatclash"
dynamic = ["version"]
description = "ChatArch proxy toolkit for Clash, subconverter, and proxy service operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.4.2,<9.0", "chatstyle>=0.1.0,<0.2.0", "chatenv>=0.2.2,<0.3.0", "PyYAML>=6.0.3,<7.0"]
authors = [{name = "rexwzh", email = "1073853456@qq.com"}]
keywords = ["chatclash", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
chatclash = "chatclash.cli:main"

[project.entry-points."chatenv.configs"]
chatclash = "chatclash.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.4.0", "mkdocs-material>=9.0.0", "mike>=2.0.0"]

[tool.setuptools.dynamic]
version = {attr = "chatclash.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
